<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


        <link rel="stylesheet" href="styles/globals.css">
        <link rel="stylesheet" href="styles/layout.css">
        <link rel="stylesheet" href="styles/cards.css">
        <link rel="stylesheet" href="styles/modals.css">

    </head>
    <body onload="loadLists()">

        <div class="container">

            <div class="items-panel-container" id="items-panel-container">

                <div class="interaction-menu">

                    <div class="hamburger-menu">
                        <button onclick="toggleListSidebar()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" fill="#000000" viewBox="0 0 256 256"><path d="M88,64a8,8,0,0,1,8-8H216a8,8,0,0,1,0,16H96A8,8,0,0,1,88,64Zm128,56H96a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Zm0,64H96a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16ZM56,56H40a8,8,0,0,0,0,16H56a8,8,0,0,0,0-16Zm0,64H40a8,8,0,0,0,0,16H56a8,8,0,0,0,0-16Zm0,64H40a8,8,0,0,0,0,16H56a8,8,0,0,0,0-16Z"></path></svg>
                        </button>
                    </div>

                    <div class="search-bar-container">

                        <svg id="search-items-icon" class="search-bar-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000000" viewBox="0 0 256 256"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path></svg>
                        <input oninput="searchItems()" class="search-bar-input" id="search-items-bar-input" type="search">
                    </div>
                    <div class="filter-menu-container">

                        <div tabindex="0" onblur="this.style.display='none'" class="sort-select" id="items-sort-element">
                            <button onmousedown="sortItems('name')">Nome</button>
                            <button onmousedown="sortItems('price')">Prezzo</button>
                            <button onmousedown="sortItems('brand')">Marca</button>
                            <button onmousedown="sortItems('recent')">Più recente</button>
                            <button onmousedown="sortItems('wanted')">Più comprati</button>
                        </div>

                        <button onmousedown="event.preventDefault(); toggleSortSelect(false)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-sort-descending"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 6l9 0" /><path d="M4 12l7 0" /><path d="M4 18l7 0" /><path d="M15 15l3 3l3 -3" /><path d="M18 6l0 12" /></svg>
                        </button>

                        <span>|</span>
                        
                        <button onclick="invertSort(false)">
                            <svg id="items-arrow-up-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-up"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M16 9l-4 -4" /><path d="M8 9l4 -4" /></svg>
                            <svg id="items-arrow-down-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M16 15l-4 4" /><path d="M8 15l4 4" /></svg>
                        </button>
                    </div>
                    
                </div>  

                <div class="card-container firstReverseCall" id="items-container"></div>
                
            </div>








            <div class="lists-sidebar-container" id="lists-sidebar-container">
                    
                <div class="overlay" onclick="toggleListSidebar()"></div>

                <div class="lists-sidebar">
                    
                   <div class="interaction-menu">
                        <div class="search-bar-container">
                            <svg id="search-lists-icon" class="search-bar-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000000" viewBox="0 0 256 256"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path></svg>
                            
                            <input oninput="searchLists()" id="search-list-bar-input" class="search-bar-input">       
                        </div>
                        <div class="filter-menu-container">

                            <div tabindex="0" onblur="this.style.display='none'" class="sort-select" id="lists-sort-element">
                                <button onmousedown="sortLists('name')">Nome</button>
                                <button onmousedown="sortLists('itemsCount')">N. Articoli</button>
                                <button onmousedown="sortLists('cost')">Costo</button>
                                <button onmousedown="sortLists('recent')">Più recente</button>
                            </div>

                            <button onmousedown="event.preventDefault(); toggleSortSelect(true)">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-sort-descending"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 6l9 0" /><path d="M4 12l7 0" /><path d="M4 18l7 0" /><path d="M15 15l3 3l3 -3" /><path d="M18 6l0 12" /></svg>
                            </button>
                            
                            <span>|</span>
                            
                            <button onclick="invertSort(true)">
                                <svg id="lists-arrow-up-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-up"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M16 9l-4 -4" /><path d="M8 9l4 -4" /></svg>
                                <svg id="lists-arrow-down-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-down"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 5l0 14" /><path d="M16 15l-4 4" /><path d="M8 15l4 4" /></svg>
                            </button>
                        </div>
                        
                    </div>   

                    <div class="card-container" id="lists-container"></div>

                    <div class="action-menu-container">
    
                        <div class="action-menu">

                            <button onclick="toggleTheme()">
                                <svg id="moon-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"></path></svg>
                                <svg id="sun-svg" xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"></path></svg>
                            </button>
                            <button onclick="toggleNewListPopup(true)">
                                Nuova lista
                            </button>
                        </div>
                        
                    </div>
                </div>

            
            </div>









            <div class="action-menu-container">

                <div class="action-menu">
                        <button onclick="toggleNewItemPopup(true)">
                            Nuovo prodotto
                        </button>
                </div>                
            </div>
            <div class="new-list-popup" id="new-list-popup">

                <div class="overlay" onclick="toggleModal('new-list-popup', false, '.new-list-popup-container')"></div>

                <div class="new-list-popup-container">

                    <input type="text" placeholder="Nome della lista" id="new-list-name-input">
                    <button onclick="createNewList()">Crea</button>
                    <button onclick="toggleModal('new-list-popup', false, '.new-list-popup-container')">Annulla</button>
                </div>
            </div>

            <div class="new-item-popup" id="new-item-popup">

                <div class="overlay" onclick="toggleModal('new-item-popup', false, '.new-item-popup-container')"></div>
                
                    <div class="new-item-popup-container">
                        <form class="item-input-form">
                            <input type="text" maxlength="25" placeholder="Nome" id="new-item-name-input" autofocus>
                            <input type="text" maxlength="10" placeholder="Peso" id="new-item-weight-input">
                            <input  type="text" maxlength="10" placeholder="Quantità" id="new-item-qty-input">
                            <input type="number" min="0.1" placeholder="Prezzo" id="new-item-price-input">
                            <input type="number" min="0.1" placeholder="Prezzo/Kg" id="new-item-priceKG-input">
                            <input type="text" maxlength="10" placeholder="Tipo" id="new-item-type-input">
                            <input type="text" maxlength="10" placeholder="Marca" id="new-item-brand-input">
                        </form>
                        
                        <button onclick="createNewItem()">Crea</button>
                        <button onclick="toggleModal('new-item-popup', false, '.new-item-popup-container')">Annulla</button>
                    </div>
            </div>

        </div>

        <div class="list-selection" id="list-selection" onclick="toggleModal('list-selection', false)">  
        </div>

        <div class="item-display" id="item-display" onclick="toggleModal('item-display', false)">
        </div>
        
        <script src="scripts/app.js"></script>
        <script src="scripts/data.js"></script>
        <script src="scripts/storage.js"></script>
        <script src="scripts/ui.js"></script>

    </body>
</html>
