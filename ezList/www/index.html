<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        <link rel="stylesheet" href="styles/globals.css">
        <link rel="stylesheet" href="styles/layout.css">
        <link rel="stylesheet" href="styles/cards.css">
        <link rel="stylesheet" href="styles/modals.css">

    </head>
    <body onload="loadLists()">
        
        <script src="scripts/data.js" defer></script>
        <script src="scripts/storage.js" defer></script>
        <script src="scripts/ui.js" defer></script>
        <script src="scripts/app.js" defer></script>


        <div class="container">

            <div class="lists-items-containers">
            
                <div class="dashboard-lists-sidebar" id="dashboard-lists-sidebar">
                    
                   <div class="interaction-menu">
                        <span>
                            <svg class="lists-search-bar-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path></svg>
                            
                            <input oninput="searchLists()" class="search-list-bar-input" id="search-list-bar-input">       
                        </span>
                        
                        <span>
                            <button>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M230.6,49.53A15.81,15.81,0,0,0,216,40H40A16,16,0,0,0,28.19,66.76l.08.09L96,139.17V216a16,16,0,0,0,24.87,13.32l32-21.34A16,16,0,0,0,160,194.66V139.17l67.74-72.32.08-.09A15.8,15.8,0,0,0,230.6,49.53ZM40,56h0Zm106.18,74.58A8,8,0,0,0,144,136v58.66L112,216V136a8,8,0,0,0-2.16-5.47L40,56H216Z"></path></svg></span>
                            </button>
                    </div>     
                    
                    <div class="card-container" id="list-container"></div>

                </div>

                <div class="dashboard-items-sidebar" id="dashboard-items-sidebar">

                    <div class="interaction-menu">
                        <span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path></svg>
                            
                            <input oninput="searchItems()" id="search-item-bar-input" type="search" placeholder="Cerca">
                        </span>
                        
                        <span>
                            <button>
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" fill="#000000" viewBox="0 0 256 256"><path d="M230.6,49.53A15.81,15.81,0,0,0,216,40H40A16,16,0,0,0,28.19,66.76l.08.09L96,139.17V216a16,16,0,0,0,24.87,13.32l32-21.34A16,16,0,0,0,160,194.66V139.17l67.74-72.32.08-.09A15.8,15.8,0,0,0,230.6,49.53ZM40,56h0Zm106.18,74.58A8,8,0,0,0,144,136v58.66L112,216V136a8,8,0,0,0-2.16-5.47L40,56H216Z"></path></svg></span>
                            </button>
                    </div>   

                    <div class="card-container" id="items-container"></div>
                    
                </div>
            </div>

            <div class="dashboard-menu-container">
                <div class="dashboard-lists-menu">
                    <button onclick="showNewListPopup()">
                        Nuova lista
                    </button>
                </div>

                <div class="dashboard-items-menu">
                        <button onclick="showNewItemPopup()">
                            Nuovo prodotto
                        </button>
                </div>                
            </div>
            <div class="new-list-popup" id="new-list-popup">

                <div class="overlay" onclick="closeNewListPopup()"></div>

                <div class="new-list-popup-container">

                    <input type="text" placeholder="Nome della lista" id="new-list-name-input">
                    <button onclick="createNewList()">Crea</button>
                    <button onclick="closeNewListPopup()">Annulla</button>
                </div>
            </div>

            <div class="new-item-popup" id="new-item-popup">

                <div class="overlay" onclick="closeNewItemPopup()"></div>
                
                    <div class="new-item-popup-container">
                        <form class="item-input-form">
                            <input type="text" placeholder="Nome" id="new-item-name-input" autofocus>
                            <input type="text" placeholder="Peso" id="new-item-weight-input">
                            <input type="text" placeholder="Quantità" id="new-item-qty-input">
                            <input type="number" min="0.1" placeholder="Prezzo" id="new-item-price-input">
                            <input type="number" min="0.1" placeholder="Prezzo/Kg" id="new-item-priceKG-input">
                            <input type="text" placeholder="Tipo" id="new-item-type-input">
                            <input type="text" placeholder="Marca" id="new-item-brand-input">
                        </form>
                        
                        <button onclick="createNewItem()">Crea</button>
                        <button onclick="closeNewItemPopup()">Annulla</button>
                    </div>
            </div>

        </div>

        <div class="list-selection" id="list-selection" onclick="closeListSelection()">  
        </div>

        <div class="item-display" id="item-display" onclick="closeItemDisplay()">
        </div>

        
    </body>
</html>
